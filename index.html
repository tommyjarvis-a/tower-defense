function pickRoute(s){const blocked=new Set(G.bars.map(b=>key(b.x,b.y)));blocked.delete(s);const D=bfs(blocked);
 if(D[s]!=null){const lim=D[s]+SLACK,out=[],seen=new Set([s]);

 if(xr-ww-12*U-X.measureText(ht).width>xl){X.fillStyle='#7dff4a';X.fillText(ht,xr-ww-12*U,cy)}

 const B=bounds();for(const k of KINDS){const[bx,by,bw,bh]=B[k];btn(bx,by,bw,bh,'',T[k].col,picked==k,G.coins<T[k].cost);
  if(bw>bh*1.5){const s=Math.min(bh*.6,bw*.3);drawIcon(k,bx+s*.75,by+bh/2,s);X.textAlign='left';X.fillStyle='#e8f8ff';X.font='600 '+Math.round(12*U)+'px system-ui';X.fillText(LBL[k],bx+s*1.45,by+bh*.36);X.fillStyle='#ffd84a';X.fillText('◉'+T[k].cost,bx+s*1.45,by+bh*.66)}

 const g=B.go,last=!G.active&&G.wave==CFG.TOTAL_WAVES-1;btn(g[0],g[1],g[2],g[3],G.over||G.won?'Restart':G.paused?'▶ Resume':G.active?'⏸ Pause':last?'Start BOSS':'Start Round',G.over?'#ff5a7a':G.paused?'#7dff4a':G.active?'#00f0ff':last?'#ff3c6e':'#7dff4a',G.paused,false)}
function draw(now){const w=W.clientWidth,h=W.clientHeight;if(C.width!=Math.round(w*(window.devicePixelRatio||1))||C.height!=Math.round(h*(window.devicePixelRatio||1)))layout();X.fillStyle='#070914';X.fillRect(0,0,w,h);
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)(PATH.has(key(x,y))?drawPath:drawGrass)(px(x),py(y),cell);
 X.fillStyle='#7dff4a';X.font='bold '+Math.round(Math.max(10,cell*.28))+'px system-ui';X.textBaseline='alphabetic';X.textAlign='left';X.fillText('IN ▶',px(0)+2,py(ENT[1])-6);X.textAlign='right';X.fillText('▶ OUT',px(COLS)-2,py(EXI[1])-6);
 for(const b of G.bars){if(b==sel){X.strokeStyle='#ffa020';X.lineWidth=2;X.strokeRect(px(b.x)+1,py(b.y)+1,cell-2,cell-2)}drawBarricade(px(b.x+.5),py(b.y+.5),cell,b.hp/BAR_HP)}
 for(const t of G.towers){if(t==sel){X.fillStyle='rgba(0,240,255,.08)';X.strokeStyle=T[t.k].col;X.lineWidth=1.5;X.beginPath();X.arc(px(t.x+.5),py(t.y+.5),T[t.k].range*cell,0,7);X.fill();X.stroke()}
  drawTower(t.k,px(t.x+.5),py(t.y+.5),cell,t.ang,now-t.fl<50)}
 for(const m of G.mobs)(m.boss?drawBoss:drawMob)(px(m.p[0]),py(m.p[1]),cell,m.hp/m.max,now/120+m.id);
 for(const s of G.shots)drawShot(s.k,px(s.x1),py(s.y1),px(s.x2),py(s.y2),s.life/s.max);
 for(const f of G.fx){X.globalAlpha=Math.max(0,f.life/f.max);glow(f.c,10);X.strokeStyle=f.c;X.lineWidth=2;X.beginPath();X.arc(px(f.x),py(f.y),cell*(.5-.3*f.life/f.max),0,7);X.stroke();X.globalAlpha=1;X.shadowBlur=0;if(f.t){X.fillStyle='#ffd84a';X.font='bold 12px system-ui';X.textAlign='center';X.fillText(f.t,px(f.x),py(f.y)-cell*(.6-.3*f.life/f.max))}}
 if(sel){const bw=110*U,bh=32*U,sx=px(sel.x+.5),sy=Math.max(HH+bh+4,py(sel.y-.35)),v=Math.floor(T[sel.k].cost/2),bx=Math.max(4,Math.min(sx-bw/2,ox+cell*COLS-bw-4));G.sellBtn=[bx,sy-bh-2,bw,bh];btn(bx,sy-bh-2,bw,bh,'Sell ◉'+v,'#ffd84a',false,false)}else G.sellBtn=null;
 drawHUD();
 OV=[];const ov=(title,col,lines,btns)=>{X.fillStyle='rgba(4,6,16,.78)';X.fillRect(0,0,w,h);const cx=w/2,cy=h/2;X.textAlign='center';X.textBaseline='middle';

  const bw=Math.min(170*U,(w-40)/btns.length-10),bh=46*U,y0=cy+(lines.length*22+10)*U;btns.forEach(([lab,c,act],i)=>{const x=cx-(btns.length*(bw+12)-12)/2+i*(bw+12);btn(x,y0,bw,bh,lab,c,false,false);OV.push({r:[x,y0,bw,bh],act})})};
 const stats=['Lives left: '+G.lives,'Coins: '+G.coins,'Kills: '+(G.kills||0)];

 else if(G.over)ov('GAME OVER','#ff5a7a',['Fell on wave '+G.wave+' / '+CFG.TOTAL_WAVES,'Kills: '+(G.kills||0)],[['Restart','#ff5a7a',()=>reset()]]);
 else if(G.paused)ov('PAUSED','#00f0ff',['Wave '+G.wave+' / '+CFG.TOTAL_WAVES],[['▶ Resume','#7dff4a',()=>{G.paused=false}],['Restart','#ff5a7a',()=>reset()]]);
 else{if(!G.active&&G.wave==CFG.TOTAL_WAVES-1&&!G.msg){X.fillStyle='#ff3c6e';X.font='800 '+Math.round(15*U)+'px system-ui';X.textAlign='center';glow('#ff3c6e',12);X.globalAlpha=.6+.4*Math.sin(now/200);X.fillText('⚠ BOSS WAVE NEXT ⚠',ox+cell*COLS/2,oy+cell*.5);X.globalAlpha=1;X.shadowBlur=0}
  if(G.msg){const boss=G.msg.includes('BOSS');X.fillStyle='rgba(0,0,0,.6)';X.fillRect(0,h/2-40*U,w,80*U);X.fillStyle=boss?'#ff3c6e':'#7dff4a';X.font='800 '+Math.round(Math.min(24*U,w/18))+'px system-ui';X.textAlign='center';X.textBaseline='middle';glow(X.fillStyle,14);X.fillText(G.msg,w/2,h/2);X.shadowBlur=0}}}
// ---- logic ----
// ---- logic ----
function waveInfo(n){return{count:6+n*2+Math.floor(n*n/6),speed:Math.min(3.2,1.3+n*.08),gap:Math.max(.35,.9-n*.03)}}
function startRound(){if(G.over||G.won){reset();return}if(G.active||G.paused)return;G.wave++;const wi=waveInfo(G.wave);G.active=true;G.spawnLeft=wi.count+(G.wave==CFG.TOTAL_WAVES?1:0);G.spawnT=0;G.speed=wi.speed;G.gap=wi.gap;G.msg=G.wave==CFG.TOTAL_WAVES?'⚠ BOSS WAVE ⚠':'';G.msgT=G.msg?2.5:0}
let mid=0;
function spawn(boss){const r=pickRoute(ENT+'');const g=Math.pow(1+HP_GROWTH,Math.max(0,G.wave-1));
 const m=boss?{boss:1,hp:CFG.BOSS_HP*g,spd:CFG.BOSS_SPEED,lives:CFG.BOSS_LIVES,dps:CFG.BOSS_DPS,reward:CFG.BOSS_REWARD}:{hp:mobHP(G.wave),spd:1,lives:1,dps:MOB_DPS,reward:CFG.KILL_REWARD};
 m.max=m.hp;Object.assign(m,{id:mid++,route:r,i:0,t:0,trav:0,p:[ENT[0]+.5,ENT[1]+.5]});G.mobs.push(m);return m}
function moveMob(m,dt){let step=G.speed*m.spd*dt;const s0=step;m.atk=null;
 while(step>0){const a=ctr(m.route[m.i]),bn=m.route[m.i+1];if(bn==null){m.exit=1;return}const b=ctr(bn);
  const L=Math.hypot(b[0]-a[0],b[1]-a[1])||1e-6;const ba=typeof bn=='string'&&barAt(bn);
  const stopT=ba?Math.max(0,1-.6/L):1; // stop just short of a barricade to attack
  if(m.t>=stopT&&ba){m.atk=ba;break}
  const room=(stopT-m.t)*L;if(step<room){m.t+=step/L;step=0}else{step-=room;m.t=stopT;if(!ba){m.i++;m.t=0}}}
 m.trav+=s0-step;
 const a=ctr(m.route[m.i]),bn=m.route[m.i+1];if(bn==null){m.exit=1;return}const b=ctr(bn);m.p=[a[0]+(b[0]-a[0])*m.t+.5,a[1]+(b[1]-a[1])*m.t+.5]}
function remaining(m){const n=m.route[m.i+1];return(typeof n=='string'?DIST[n]??99:99)+1-m.t}
function update(dt){if(G.over||G.won)return;G.time=(G.time||0)+dt;if(G.msgT>0){G.msgT-=dt;if(G.msgT<=0)G.msg=''}
 if(G.active&&G.spawnLeft>0){G.spawnT-=dt;if(G.spawnT<=0){spawn(G.wave==CFG.TOTAL_WAVES&&G.spawnLeft==1);G.spawnLeft--;G.spawnT=G.gap}}
 let destroyed=false;
 for(const m of G.mobs){moveMob(m,dt);if(m.exit){m.dead=1;G.lives-=m.lives;G.fx.push({x:EXI[0]-.5,y:EXI[1]+.5,c:'#ff5a7a',life:.5,max:.5})}
  else if(m.atk){m.atk.hp-=m.dps*dt;if(Math.random()<dt*6)G.fx.push({x:m.atk.x+.5,y:m.atk.y+.5,c:'#ffa020',life:.2,max:.2})}}
 for(const b of G.bars)if(b.hp<=0){destroyed=true;G.fx.push({x:b.x+.5,y:b.y+.5,c:'#ffa020',life:.6,max:.6});if(sel==b)sel=null}
 if(destroyed){G.bars=G.bars.filter(b=>b.hp>0);recompute()}
 if(G.lives<=0){G.lives=0;G.over=true;G.active=false;G.msg=''}
 G.mobs=G.mobs.filter(m=>!m.dead);
 for(const t of G.towers){const S=T[t.k];t.cd-=dt;let best=null,bd=1e9;for(const m of G.mobs){const dx=m.p[0]-t.x-.5,dy=m.p[1]-t.y-.5,r=remaining(m);if(dx*dx+dy*dy<=S.range*S.range&&r<bd&&m.hp>0){bd=r;best=m}}
  if(best){t.ang=Math.atan2(best.p[1]-t.y-.5,best.p[0]-t.x-.5);if(t.cd<=0){t.cd=1/S.rate;t.fl=performance.now();best.hp-=S.dmg;G.shots.push({k:t.k,x1:t.x+.5,y1:t.y+.5,x2:best.p[0]+(Math.random()-.5)*.15,y2:best.p[1]+(Math.random()-.5)*.15,life:t.k=='mg'?.06:.18,max:t.k=='mg'?.06:.18});
   if(best.hp<=0){G.coins+=best.reward;G.kills=(G.kills||0)+1;if(best.boss)G.bossKilled=1;G.fx.push({x:best.p[0],y:best.p[1],c:best.boss?'#c060ff':'#7dff4a',life:best.boss?1.2:.5,max:best.boss?1.2:.5,t:'+'+best.reward})}}}}
 G.mobs=G.mobs.filter(m=>m.hp>0);
 for(const a of[G.shots,G.fx])for(const s of a)s.life-=dt;G.shots=G.shots.filter(s=>s.life>0);G.fx=G.fx.filter(s=>s.life>0);
 if(G.active&&G.spawnLeft==0&&G.mobs.length==0&&!G.over){G.active=false;const b=25+G.wave*5;G.coins+=b;
  if(G.wave>=CFG.TOTAL_WAVES){G.won=true;G.msg=''}else{G.msg=G.wave==CFG.TOTAL_WAVES-1?'Wave '+G.wave+' cleared! ⚠ BOSS NEXT':'Wave '+G.wave+' cleared! +'+b;G.msgT=2.5}}}
// advance simulation by real dt: frozen when paused, timeScale 2 while ⏩ held, substepped so fast mobs never skip
function advance(dt){if(G.paused||G.won||G.over)return;const scaled=dt*(G.hold?CFG.FAST_SCALE:1);const n=Math.max(1,Math.ceil(scaled/CFG.MAX_STEP));for(let i=0;i<n;i++)update(scaled/n)}
function loop(now){const dt=Math.min(.05,(now-(last||now))/1000);last=now;advance(dt);draw(now);requestAnimationFrame(loop)}
function inR(p,r){return r&&p[0]>=r[0]&&p[0]<=r[0]+r[2]&&p[1]>=r[1]&&p[1]<=r[1]+r[3]}
function place(k,gx,gy){const c=key(gx,gy);if(G.coins<T[k].cost){G.msg='Not enough coins';G.msgT=1.5;return false}
 if(G.towers.some(t=>t.x==gx&&t.y==gy)||barAt(c))return false;
 const say=s=>{G.msg=s;G.msgT=1.5;return false};
 if(k=='bar'){if(!PATH.has(c))return say('Barricades go on the path');if(PROTECT.has(c))return say("Can't block entrance/exit");
  if(G.mobs.some(m=>Math.abs(m.p[0]-gx-.5)<.75&&Math.abs(m.p[1]-gy-.5)<.75))return say('Mob in the way');
  G.coins-=T.bar.cost;G.bars.push({k:'bar',x:gx,y:gy,hp:BAR_HP});recompute();return true}
 if(PATH.has(c))return say('Towers go on grass');
 G.coins-=T[k].cost;G.towers.push({k,x:gx,y:gy,cd:0,ang:0,fl:-1e9});return true}
function tap(x,y){const p=[x,y],B=bounds(),H=hudBtns();
 for(const o of OV)if(inR(p,o.r)){o.act();return}
 if(inR(p,B.go)){if(G.over||G.won)reset();else if(G.paused)G.paused=false;else if(G.active){G.paused=true;G.hold=false}else startRound();return}
 if(G.paused||G.over||G.won)return;
 if(G.msgT<=0||G.msg=='Not enough coins')G.msg='';
 if(inR(p,G.sellBtn)){G.coins+=Math.floor(T[sel.k].cost/2);if(sel.k=='bar'){G.bars=G.bars.filter(b=>b!=sel);sel=null;recompute()}else{G.towers=G.towers.filter(t=>t!=sel);sel=null}return}
 for(const k of KINDS)if(inR(p,B[k])){picked=picked==k?null:k;sel=null;return}
 const gx=Math.floor((x-ox)/cell),gy=Math.floor((y-oy)/cell);if(gx<0||gy<0||gx>=COLS||gy>=ROWS){sel=null;return}
 const t=G.towers.find(t=>t.x==gx&&t.y==gy)||barAt(key(gx,gy));if(t){sel=sel==t?null:t;picked=null;return}
 sel=null;if(picked)place(picked,gx,gy)}
// input: taps + hold-for-2x (touch, mouse, pointer)
let holdTouch=null;const rel=(e)=>{const r=C.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
const onFast=p=>G.active&&!G.paused&&!G.over&&!G.won&&inR(p,hudBtns().fast);
const release=()=>{holdTouch=null;if(G)G.hold=false};
C.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){const p=rel(t);if(onFast(p)){holdTouch=t.identifier;G.hold=true}else tap(p[0],p[1])}},{passive:false});
['touchend','touchcancel'].forEach(ev=>C.addEventListener(ev,e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===holdTouch)release()},{passive:false}));
C.addEventListener('mousedown',e=>{const p=rel(e);if(onFast(p))G.hold=true;else tap(p[0],p[1])});
addEventListener('mouseup',()=>{if(holdTouch==null)release()});
['pointerup','pointercancel'].forEach(ev=>addEventListener(ev,e=>{if(e.pointerType!='touch')release()}));
addEventListener('blur',release);document.addEventListener('visibilitychange',release);
C.addEventListener('mouseleave',()=>{if(holdTouch==null)release()});
['gesturestart','gesturechange','dblclick','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
reset();layout();requestAnimationFrame(loop);
</script></body></html>
