 if(FX.mode=='post'&&FX.q!='off')for(const m of G.mobs)(m.boss?drawBoss:drawMob)(px(m.p[0]),py(m.p[1]),cell,m.hp/m.max,now/120+m.id);
 for(const t of[...G.towers,...G.bars]){const l=lvlOf(t);if(l<2)continue;const n=l-1,r=Math.max(2,cell*.06),gap=r*2.6,x0=px(t.x+.5)-(n-1)*gap/2,y=py(t.y+.93);
  X.fillStyle='rgba(0,0,0,.7)';X.beginPath();X.roundRect(x0-r*1.8,y-r*1.8,(n-1)*gap+r*3.6,r*3.6,r*1.8);X.fill();X.fillStyle=l>=CFG.MAX_TOWER_LEVEL?'#ff3cc8':'#ffd84a';for(let i=0;i<n;i++){X.beginPath();X.arc(x0+i*gap,y,r,0,7);X.fill()}}
 G.sellBtn=G.upBtn=null;if(!sel)return;
 const t=sel,l=lvlOf(t),max=l>=CFG.MAX_TOWER_LEVEL,c=upCost(t),can=!max&&G.coins>=c,w=W.clientWidth,h=W.clientHeight;
 const pw=Math.min(w-16,230*U),ph=86*U,sx=px(t.x+.5);let x=cl(8,w-pw-8,sx-pw/2),y=py(t.y)-ph-8*U;if(y<HH+6)y=py(t.y+1)+8*U;y=cl(HH+6,h-ph-80*U,y);
 pill(x,y,pw,ph,.88,T[t.k].col);const nm=t.k=='bar'?'Barricade':T[t.k].name,lab=t.k=='bar'?'HP':'DMG';
 X.textAlign='left';X.textBaseline='middle';X.fillStyle='#e8f8ff';X.font='800 '+Math.round(13*U)+'px system-ui';X.fillText(nm+'  Lv '+l+(max?' (MAX)':''),x+12*U,y+15*U);
 X.font='600 '+Math.round(12*U)+'px system-ui';X.fillStyle='#9fe';X.fillText(lab+' '+fmt(statOf(t,l))+(max?'':'  →  '+fmt(statOf(t,l+1))),x+12*U,y+33*U);
 const bw=(pw-30*U)/2,bh=34*U,by=y+ph-bh-8*U;G.upBtn=[x+10*U,by,bw,bh];G.sellBtn=[x+20*U+bw,by,bw,bh];
 btn(...G.upBtn,max?'MAX':'⬆ ◉'+c,can?'#7dff4a':'#445',false,!can);btn(...G.sellBtn,'Sell ◉'+Math.floor(spentOf(t)/2),'#ffd84a',false,false)}
// ===================== PINCH ZOOM / PAN (world transform folded into ox/oy/cell) =====================
const VIEW={z:1,tx:0,ty:0},BV={cell:1,ox:0,oy:0};
function applyView(){const w=W.clientWidth,h=W.clientHeight,z=VIEW.z,mw=z*BV.cell*COLS,mh=z*BV.cell*ROWS;
 let L=z*BV.ox+VIEW.tx,Tp=z*BV.oy+VIEW.ty;L=mw>=w?cl(w-mw,0,L):(w-mw)/2;Tp=mh>=h?cl(h-mh,0,Tp):(h-mh)/2;VIEW.tx=L-z*BV.ox;VIEW.ty=Tp-z*BV.oy;
 cell=BV.cell*z;ox=z*BV.ox+VIEW.tx;oy=z*BV.oy+VIEW.ty}
function zoomAt(m,z){z=cl(1,CFG.MAX_ZOOM,z);const s0=[(m[0]-VIEW.tx)/VIEW.z,(m[1]-VIEW.ty)/VIEW.z];VIEW.z=z;VIEW.tx=m[0]-z*s0[0];VIEW.ty=m[1]-z*s0[1];applyView()}
function panBy(dx,dy){VIEW.tx+=dx;VIEW.ty+=dy;applyView()}
function resetZoom(){VIEW.z=1;VIEW.tx=VIEW.ty=0;applyView()}
const _layoutBase=layout;
layout=function(){const had=BV.cell>1&&cell,w0=W.clientWidth,h0=W.clientHeight;let cu=.5,cv=.5;if(had){cu=(w0/2-ox)/(cell*COLS);cv=(h0/2-oy)/(cell*ROWS)}
 _layoutBase();BV.cell=cell;BV.ox=ox;BV.oy=oy;const w=W.clientWidth,h=W.clientHeight,z=VIEW.z;VIEW.tx=w/2-z*BV.ox-cu*z*BV.cell*COLS;VIEW.ty=h/2-z*BV.oy-cv*z*BV.cell*ROWS;applyView()};
const TS={pts:new Map(),tapId:null,start:null,last:null,moved:false,multi:false,pinch:null};
function startPinch(){const[a,b]=[...TS.pts.values()];TS.pinch={d0:Math.hypot(a[0]-b[0],a[1]-b[1])||1,z0:VIEW.z,m0:[(a[0]+b[0])/2,(a[1]+b[1])/2],t0:[VIEW.tx,VIEW.ty]}}
function movePinch(){const[a,b]=[...TS.pts.values()],P=TS.pinch,d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
 const s0=[(P.m0[0]-P.t0[0])/P.z0,(P.m0[1]-P.t0[1])/P.z0],z=cl(1,CFG.MAX_ZOOM,P.z0*d/P.d0);VIEW.z=z;VIEW.tx=m[0]-z*s0[0];VIEW.ty=m[1]-z*s0[1];applyView()}
C.style.touchAction='none';
C.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){const p=rel(t);if(onFast(p)){holdTouch=t.identifier;G.hold=true;continue}
  TS.pts.set(t.identifier,p);if(TS.pts.size==1){TS.tapId=t.identifier;TS.start=p;TS.last=p;TS.moved=false;TS.multi=false}else{TS.multi=true;TS.tapId=null;if(TS.pts.size==2)startPinch()}}},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(TS.pts.has(t.identifier))TS.pts.set(t.identifier,rel(t));
 if(TS.pts.size>=2&&TS.pinch)movePinch();else if(TS.pts.size==1){const p=[...TS.pts.values()][0];if(TS.start&&Math.hypot(p[0]-TS.start[0],p[1]-TS.start[1])>8)TS.moved=true;if((TS.moved||!TS.start)&&TS.last&&VIEW.z>1.001)panBy(p[0]-TS.last[0],p[1]-TS.last[1]);TS.last=p}},{passive:false});
['touchend','touchcancel'].forEach(ev=>C.addEventListener(ev,e=>{e.preventDefault();for(const t of e.changedTouches){if(!TS.pts.has(t.identifier))continue;const p=rel(t);TS.pts.delete(t.identifier);
  if(ev=='touchend'&&t.identifier===TS.tapId&&!TS.moved&&!TS.multi)tap(p[0],p[1]);if(t.identifier===TS.tapId)TS.tapId=null;
  if(TS.pts.size<2)TS.pinch=null;if(TS.pts.size==1){TS.last=[...TS.pts.values()][0];TS.start=null}}},{passive:false}));
C.addEventListener('wheel',e=>{e.preventDefault();zoomAt(rel(e),VIEW.z*Math.exp(-e.deltaY*.0015))},{passive:false});
fxSetup();
reset();layout();requestAnimationFrame(loop);checkUpdate();
</script></body></html>
