const C=document.getElementById('c'),X=C.getContext('2d'),W=document.getElementById('wrap');
// One logical map for every orientation; only the screen layout changes on rotation.
const COLS=12,ROWS=9,PTS=[[-1,1],[2,1],[2,7],[5,7],[5,2],[8,2],[8,6],[10,6],[10,4],[12,4]];
const PATH=new Set();for(let i=0;i<PTS.length-1;i++){let[a,b]=PTS[i],[c,d]=PTS[i+1];let dx=Math.sign(c-a),dy=Math.sign(d-b);for(let x=a,y=b;;x+=dx,y+=dy){PATH.add(x+','+y);if(x==c&&y==d)break;}}
function setMap(){}
let LAND=false,SIDE=0;
const T={mg:{name:'Machine Gunner',cost:150,dmg:5,rate:8,range:2.3,col:'#00f0ff'},sn:{name:'Sniper',cost:350,dmg:100,rate:0.4,range:5.5,col:'#ff3cc8'}};
let G,cell,ox,oy,bar,dpr,sel=null,picked=null,last=0;
function reset(){setMap();G={coins:500,lives:20,wave:0,mobs:[],towers:[],shots:[],fx:[],active:false,spawnLeft:0,spawnT:0,over:false,msg:''}}
reset();
function layout(){dpr=window.devicePixelRatio||1;const w=W.clientWidth,h=W.clientHeight;C.width=w*dpr;C.height=h*dpr;X.setTransform(dpr,0,0,dpr,0,0);
 const hud=44;LAND=w>h*1.15;
 if(LAND){bar=0;SIDE=Math.max(120,Math.min(170,w*.17));cell=Math.min((w-SIDE-8)/COLS,(h-hud-4)/ROWS);ox=(w-SIDE-cell*COLS)/2;oy=hud+(h-hud-cell*ROWS)/2;}
 else{SIDE=0;bar=Math.max(70,Math.min(96,h*.12));cell=Math.min(w/COLS,(h-hud-bar)/ROWS);ox=(w-cell*COLS)/2;oy=hud+(h-hud-bar-cell*ROWS)/2;}}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));
const px=(gx)=>ox+gx*cell,py=(gy)=>oy+gy*cell;
function pathPos(d){for(let i=0;i<PTS.length-1;i++){let[a,b]=PTS[i],[c,e]=PTS[i+1];let L=Math.abs(c-a)+Math.abs(e-b);if(d<=L){let t=d/L;return[a+(c-a)*t+.5,b+(e-b)*t+.5]}d-=L}return null}
// ---- drawing assets ----
function glow(c,b){X.shadowColor=c;X.shadowBlur=b}
function drawGrass(x,y,s){X.fillStyle='#0b1022';X.fillRect(x,y,s,s);X.strokeStyle='rgba(60,90,160,.18)';X.lineWidth=1;X.strokeRect(x+.5,y+.5,s-1,s-1);X.fillStyle='rgba(80,255,170,.12)';X.fillRect(x+s*.2,y+s*.3,s*.06,s*.06);X.fillRect(x+s*.7,y+s*.65,s*.06,s*.06)}
function drawPath(x,y,s){X.fillStyle='#1a1440';X.fillRect(x,y,s,s);X.strokeStyle='rgba(170,90,255,.35)';X.lineWidth=Math.max(1,s*.04);X.strokeRect(x+s*.08,y+s*.08,s*.84,s*.84)}
function drawTower(k,x,y,s,ang,flash){const t=T[k];X.save();X.translate(x,y);
 X.fillStyle='#141a33';glow(t.col,s*.3);X.strokeStyle=t.col;X.lineWidth=s*.06;
 X.beginPath();if(k=='mg'){X.arc(0,0,s*.38,0,7)}else{for(let i=0;i<6;i++)X.lineTo(Math.cos(i*Math.PI/3)*s*.4,Math.sin(i*Math.PI/3)*s*.4);X.closePath()}X.fill();X.stroke();
 X.rotate(ang);X.fillStyle=t.col;
 if(k=='mg'){X.fillRect(s*.05,-s*.12,s*.38,s*.08);X.fillRect(s*.05,s*.04,s*.38,s*.08);X.beginPath();X.arc(0,0,s*.17,0,7);X.fill()}
 else{X.fillRect(0,-s*.045,s*.55,s*.09);X.fillRect(s*.1,-s*.1,s*.14,s*.2);X.beginPath();X.arc(0,0,s*.14,0,7);X.fill()}
 if(flash){const L=k=='mg'?s*.45:s*.58;glow('#fff6a0',s*.4);X.fillStyle='#fff6a0';X.beginPath();X.moveTo(L,0);X.lineTo(L+s*.25,-s*.12);X.lineTo(L+s*.18,0);X.lineTo(L+s*.25,s*.12);X.closePath();X.fill()}
 X.restore();X.shadowBlur=0}
function drawMob(x,y,s,hp,ph){X.save();X.translate(x,y);const r=s*.27*(1+.06*Math.sin(ph));glow('#7dff4a',s*.35);X.fillStyle='#2b7a1c';X.strokeStyle='#7dff4a';X.lineWidth=s*.05;
 X.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4,rr=i%2?r*.8:r;X.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}X.closePath();X.fill();X.stroke();X.shadowBlur=0;
 X.fillStyle='#eaffd0';X.beginPath();X.arc(-r*.3,-r*.15,r*.18,0,7);X.arc(r*.3,-r*.15,r*.18,0,7);X.fill();
 const bw=s*.6,bh=Math.max(3,s*.08);X.fillStyle='#300';X.fillRect(-bw/2,-r-bh*2.2,bw,bh);X.fillStyle=hp>.5?'#3f6':hp>.25?'#fc3':'#f33';X.fillRect(-bw/2,-r-bh*2.2,bw*hp,bh);X.restore()}
function drawShot(k,x1,y1,x2,y2,a){const t=T[k];X.globalAlpha=a;glow(t.col,10);X.strokeStyle=k=='mg'?'#bff':'#ffd0f4';X.lineWidth=k=='mg'?1.5:3;X.beginPath();
 if(k=='mg'){X.moveTo(x2-(x2-x1)*.15,y2-(y2-y1)*.15)}else X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();X.globalAlpha=1;X.shadowBlur=0}
function btn(x,y,w,h,label,col,on,dis){X.fillStyle=on?'rgba(0,240,255,.18)':'#11162c';X.strokeStyle=dis?'#334':col;X.lineWidth=2;glow(dis?'transparent':col,on?14:6);X.beginPath();X.roundRect(x,y,w,h,10);X.fill();X.stroke();X.shadowBlur=0;X.fillStyle=dis?'#556':'#e8f8ff';X.font='600 '+Math.min(15,h*.28)+'px system-ui';X.textAlign='center';X.textBaseline='middle';X.fillText(label,x+w/2,y+h/2)}
function bounds(){const w=W.clientWidth,h=W.clientHeight;if(LAND){const bx=w-SIDE+6,bw=SIDE-12,bh=Math.min(90,(h-44-32)/3);return{mg:[bx,52,bw,bh],sn:[bx,60+bh,bw,bh],go:[bx,68+2*bh,bw,bh]}}const by=h-bar+8,bh=bar-16,n=w<500;const bw=n?(w-32)/3:150;return{mg:[8,by,bw,bh],sn:[16+bw,by,bw,bh],go:[w-8-bw,by,bw,bh]}}
function drawHUD(){const w=W.clientWidth,h=W.clientHeight;X.fillStyle='rgba(10,14,30,.9)';X.fillRect(0,0,w,40);if(LAND)X.fillRect(w-SIDE,40,SIDE,h-40);else X.fillRect(0,h-bar,w,bar);
 X.strokeStyle='#00f0ff';glow('#00f0ff',8);X.beginPath();X.moveTo(0,40);X.lineTo(w,40);if(LAND){X.moveTo(w-SIDE,40);X.lineTo(w-SIDE,h)}else{X.moveTo(0,h-bar);X.lineTo(w,h-bar)}X.lineWidth=1;X.stroke();X.shadowBlur=0;
 X.font='700 16px system-ui';X.textBaseline='middle';X.textAlign='left';X.fillStyle='#ffd84a';X.fillText('◉ '+G.coins,10,20);X.fillStyle='#ff5a7a';X.textAlign='center';X.fillText('♥ '+G.lives,w/2,20);X.fillStyle='#7df';X.textAlign='right';X.fillText('WAVE '+G.wave,w-10,20);
 const B=bounds();for(const k of['mg','sn']){const b=B[k];btn(b[0],b[1],b[2],b[3],'',T[k].col,picked==k,G.coins<T[k].cost);drawTower(k,b[0]+b[3]*.42,b[1]+b[3]*.5,b[3]*.6,-.5,false);X.textAlign='left';X.fillStyle='#e8f8ff';X.font='600 12px system-ui';X.fillText(k=='mg'?'Gunner':'Sniper',b[0]+b[3]*.8,b[1]+b[3]*.36);X.fillStyle='#ffd84a';X.fillText('◉'+T[k].cost,b[0]+b[3]*.8,b[1]+b[3]*.66)}
 const g=B.go;btn(g[0],g[1],g[2],g[3],G.over?'Restart':G.active?'Wave '+G.wave+'…':'Start Round',G.over?'#ff5a7a':'#7dff4a',false,G.active&&!G.over)}
function draw(now){const w=W.clientWidth,h=W.clientHeight;X.fillStyle='#070914';X.fillRect(0,0,w,h);
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)(PATH.has(x+','+y)?drawPath:drawGrass)(px(x),py(y),cell);
 X.fillStyle='#7dff4a';X.font='bold 11px system-ui';X.textAlign='left';X.fillText('IN ▶',px(0)+2,py(1)-6);X.textAlign='right';X.fillText('▶ OUT',px(COLS)-2,py(PTS[PTS.length-1][1])-6);
  for(const t of G.towers){if(t==sel){X.fillStyle='rgba(0,240,255,.08)';X.strokeStyle=T[t.k].col;X.lineWidth=1.5;X.beginPath();X.arc(px(t.x+.5),py(t.y+.5),T[t.k].range*cell,0,7);X.fill();X.stroke()}
  drawTower(t.k,px(t.x+.5),py(t.y+.5),cell,t.ang,now-t.fl<50)}
 for(const m of G.mobs)drawMob(px(m.p[0]),py(m.p[1]),cell,m.hp/50,now/120+m.id);
 for(const s of G.shots)drawShot(s.k,px(s.x1),py(s.y1),px(s.x2),py(s.y2),s.life/s.max);
 for(const f of G.fx){X.globalAlpha=f.life/f.max;glow(f.c,10);X.strokeStyle=f.c;X.lineWidth=2;X.beginPath();X.arc(px(f.x),py(f.y),cell*(.5-.3*f.life/f.max),0,7);X.stroke();X.globalAlpha=1;X.shadowBlur=0;if(f.t){X.fillStyle='#ffd84a';X.font='bold 12px system-ui';X.textAlign='center';X.fillText(f.t,px(f.x),py(f.y)-cell*(.6-.3*f.life/f.max))}}
 if(sel){const sx=px(sel.x+.5),sy=py(sel.y-.35),v=Math.floor(T[sel.k].cost/2);G.sellBtn=[sx-55,sy-34,110,32];btn(sx-55,sy-34,110,32,'Sell ◉'+v,'#ffd84a',false,false)}else G.sellBtn=null;
 drawHUD();
 if(G.msg){X.fillStyle='rgba(0,0,0,.6)';X.fillRect(0,h/2-40,w,80);X.fillStyle=G.over?'#ff5a7a':'#7dff4a';X.font='800 26px system-ui';X.textAlign='center';glow(X.fillStyle,14);X.fillText(G.msg,w/2,h/2);X.shadowBlur=0}}
// ---- logic ----
function waveInfo(n){return{count:6+n*2+Math.floor(n*n/6),speed:Math.min(3.2,1.3+n*.08),gap:Math.max(.35,.9-n*.03)}}
function startRound(){if(G.over){reset();sel=picked=null;return}if(G.active)return;G.wave++;const wi=waveInfo(G.wave);G.active=true;G.spawnLeft=wi.count;G.spawnT=0;G.speed=wi.speed;G.gap=wi.gap;G.msg=''}
let mid=0;
function update(dt){if(G.over)return;
 if(G.active&&G.spawnLeft>0){G.spawnT-=dt;if(G.spawnT<=0){G.mobs.push({d:0,hp:50,id:mid++,p:pathPos(0)});G.spawnLeft--;G.spawnT=G.gap}}
 for(const m of G.mobs){m.d+=G.speed*dt;m.p=pathPos(m.d);if(!m.p){m.dead=1;G.lives--;G.fx.push({x:COLS-.5,y:PTS[PTS.length-1][1]+.5,c:'#ff5a7a',life:.5,max:.5})}}
 if(G.lives<=0){G.lives=0;G.over=true;G.active=false;G.msg='GAME OVER — Wave '+G.wave}
 G.mobs=G.mobs.filter(m=>!m.dead);
 for(const t of G.towers){const S=T[t.k];t.cd-=dt;let best=null,bd=-1;for(const m of G.mobs){const dx=m.p[0]-t.x-.5,dy=m.p[1]-t.y-.5;if(dx*dx+dy*dy<=S.range*S.range&&m.d>bd&&m.hp>0){bd=m.d;best=m}}
  if(best){t.ang=Math.atan2(best.p[1]-t.y-.5,best.p[0]-t.x-.5);if(t.cd<=0){t.cd=1/S.rate;t.fl=performance.now();best.hp-=S.dmg;G.shots.push({k:t.k,x1:t.x+.5,y1:t.y+.5,x2:best.p[0]+(Math.random()-.5)*.15,y2:best.p[1]+(Math.random()-.5)*.15,life:t.k=='mg'?.06:.18,max:t.k=='mg'?.06:.18});
   if(best.hp<=0){G.coins+=10;G.fx.push({x:best.p[0],y:best.p[1],c:'#7dff4a',life:.5,max:.5,t:'+10'})}}}}
 G.mobs=G.mobs.filter(m=>m.hp>0);
 for(const a of[G.shots,G.fx])for(const s of a)s.life-=dt;G.shots=G.shots.filter(s=>s.life>0);G.fx=G.fx.filter(s=>s.life>0);
 if(G.active&&G.spawnLeft==0&&G.mobs.length==0){G.active=false;const b=25+G.wave*5;G.coins+=b;G.msg='Wave '+G.wave+' cleared! +'+b}}
function loop(now){const dt=Math.min(.05,(now-(last||now))/1000);last=now;update(dt);draw(now);requestAnimationFrame(loop)}
function inR(p,r){return r&&p[0]>=r[0]&&p[0]<=r[0]+r[2]&&p[1]>=r[1]&&p[1]<=r[1]+r[3]}
function tap(x,y){const p=[x,y],B=bounds();G.msg=G.over?G.msg:'';
 if(inR(p,G.sellBtn)){G.coins+=Math.floor(T[sel.k].cost/2);G.towers=G.towers.filter(t=>t!=sel);sel=null;return}
 for(const k of['mg','sn'])if(inR(p,B[k])){picked=picked==k?null:k;sel=null;return}
 if(inR(p,B.go)){startRound();return}
 const gx=Math.floor((x-ox)/cell),gy=Math.floor((y-oy)/cell);if(gx<0||gy<0||gx>=COLS||gy>=ROWS){sel=null;return}
 const t=G.towers.find(t=>t.x==gx&&t.y==gy);if(t){sel=sel==t?null:t;picked=null;return}
