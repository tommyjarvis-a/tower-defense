const T={mg:{name:'Machine Gunner',cost:150,dmg:5,rate:8,range:2.3,col:'#00f0ff'},sn:{name:'Sniper',cost:350,dmg:100,rate:0.4,range:5.5,col:'#ff3cc8'},bar:{name:'Barricade',cost:100,hp:200,col:'#ffa020'}};

function reset(){G={coins:500,lives:20,wave:0,mobs:[],towers:[],bars:[],shots:[],fx:[],active:false,spawnLeft:0,spawnT:0,over:false,msg:''};sel=picked=null;recompute()}

  (function dfs(c,p){if(out.length>60)return;if(c==EXI+''){out.push(p.slice());return}for(const n of nbrs(c))if(!seen.has(n)&&!blocked.has(n)&&D[n]!=null&&p.length+D[n]<=lim){seen.add(n);p.push(n);dfs(n,p);p.pop();seen.delete(n)}})(s,[s]);
  if(out.length){// weight shorter routes a bit more
   const w=out.map(r=>1/(1+.25*(r.length-1-D[s])));let t=Math.random()*w.reduce((a,b)=>a+b);for(let i=0;i<out.length;i++){t-=w[i];if(t<=0)return out[i]}return out[0]}}
 // Every route blocked: shortest route ignoring barricades (Dijkstra-ish via BFS w/ barricade cost) -> mob will attack first barricade on it
 const A=bfs(new Set());const r=[s];let c=s;while(c!=EXI+''){const ns=nbrs(c).filter(n=>A[n]==A[c]-1);ns.sort((a,b)=>(blocked.has(a)?1:0)-(blocked.has(b)?1:0));c=ns[0];if(!c)break;r.push(c)}return r}
function mobCell(m){const a=m.route[m.i],b=m.route[m.i+1];if(!b)return null;return m.t<.5&&typeof a=='string'?a:b}

  if(barAt(c)){// pushed back: use previous node
   c=typeof m.route[m.i]=='string'&&!barAt(m.route[m.i])?m.route[m.i]:c}

 for(const m of G.mobs)drawMob(px(m.p[0]),py(m.p[1]),cell,m.hp/50,now/120+m.id);
 for(const s of G.shots)drawShot(s.k,px(s.x1),py(s.y1),px(s.x2),py(s.y2),s.life/s.max);
 for(const f of G.fx){X.globalAlpha=Math.max(0,f.life/f.max);glow(f.c,10);X.strokeStyle=f.c;X.lineWidth=2;X.beginPath();X.arc(px(f.x),py(f.y),cell*(.5-.3*f.life/f.max),0,7);X.stroke();X.globalAlpha=1;X.shadowBlur=0;if(f.t){X.fillStyle='#ffd84a';X.font='bold 12px system-ui';X.textAlign='center';X.fillText(f.t,px(f.x),py(f.y)-cell*(.6-.3*f.life/f.max))}}
 if(sel){const sx=px(sel.x+.5),sy=py(sel.y-.35),v=Math.floor(T[sel.k].cost/2),bw=110,bx=Math.max(4,Math.min(sx-55,ox+cell*COLS-bw-4));G.sellBtn=[bx,sy-34,bw,32];btn(bx,sy-34,bw,32,'Sell ◉'+v,'#ffd84a',false,false)}else G.sellBtn=null;
 drawHUD();
 if(G.msg){X.fillStyle='rgba(0,0,0,.6)';X.fillRect(0,h/2-40,w,80);X.fillStyle=G.over?'#ff5a7a':'#7dff4a';X.font='800 24px system-ui';X.textAlign='center';glow(X.fillStyle,14);X.fillText(G.msg,w/2,h/2);X.shadowBlur=0}}
// ---- logic ----
function waveInfo(n){return{count:6+n*2+Math.floor(n*n/6),speed:Math.min(3.2,1.3+n*.08),gap:Math.max(.35,.9-n*.03)}}
function startRound(){if(G.over){reset();return}if(G.active)return;G.wave++;const wi=waveInfo(G.wave);G.active=true;G.spawnLeft=wi.count;G.spawnT=0;G.speed=wi.speed;G.gap=wi.gap;G.msg=''}
let mid=0;
function spawn(){const r=pickRoute(ENT+'');G.mobs.push({hp:50,id:mid++,route:r,i:0,t:0,p:[ENT[0]+.5,ENT[1]+.5]})}
function moveMob(m,dt){let step=G.speed*dt;m.atk=null;
 while(step>0){const a=ctr(m.route[m.i]),bn=m.route[m.i+1];if(bn==null){m.exit=1;return}const b=ctr(bn);
  const L=Math.hypot(b[0]-a[0],b[1]-a[1])||1e-6;const ba=typeof bn=='string'&&barAt(bn);
  const stopT=ba?Math.max(0,1-.6/L):1; // stop just short of a barricade to attack
  if(m.t>=stopT&&ba){m.atk=ba;break}
  const room=(stopT-m.t)*L;if(step<room){m.t+=step/L;step=0}else{step-=room;m.t=stopT;if(!ba){m.i++;m.t=0}}}
 const a=ctr(m.route[m.i]),bn=m.route[m.i+1];if(bn==null){m.exit=1;return}const b=ctr(bn);m.p=[a[0]+(b[0]-a[0])*m.t+.5,a[1]+(b[1]-a[1])*m.t+.5]}
function remaining(m){const n=m.route[m.i+1];return(typeof n=='string'?DIST[n]??99:99)+1-m.t}
function update(dt){if(G.over)return;
 if(G.active&&G.spawnLeft>0){G.spawnT-=dt;if(G.spawnT<=0){spawn();G.spawnLeft--;G.spawnT=G.gap}}
 let destroyed=false;
 for(const m of G.mobs){moveMob(m,dt);if(m.exit){m.dead=1;G.lives--;G.fx.push({x:EXI[0]-.5,y:EXI[1]+.5,c:'#ff5a7a',life:.5,max:.5})}
  else if(m.atk){m.atk.hp-=MOB_DPS*dt;if(Math.random()<dt*6)G.fx.push({x:m.atk.x+.5,y:m.atk.y+.5,c:'#ffa020',life:.2,max:.2})}}
 for(const b of G.bars)if(b.hp<=0){destroyed=true;G.fx.push({x:b.x+.5,y:b.y+.5,c:'#ffa020',life:.6,max:.6});if(sel==b)sel=null}
 if(destroyed){G.bars=G.bars.filter(b=>b.hp>0);recompute()}
 if(G.lives<=0){G.lives=0;G.over=true;G.active=false;G.msg='GAME OVER — Wave '+G.wave}
 G.mobs=G.mobs.filter(m=>!m.dead);
 for(const t of G.towers){const S=T[t.k];t.cd-=dt;let best=null,bd=1e9;for(const m of G.mobs){const dx=m.p[0]-t.x-.5,dy=m.p[1]-t.y-.5,r=remaining(m);if(dx*dx+dy*dy<=S.range*S.range&&r<bd&&m.hp>0){bd=r;best=m}}
  if(best){t.ang=Math.atan2(best.p[1]-t.y-.5,best.p[0]-t.x-.5);if(t.cd<=0){t.cd=1/S.rate;t.fl=performance.now();best.hp-=S.dmg;G.shots.push({k:t.k,x1:t.x+.5,y1:t.y+.5,x2:best.p[0]+(Math.random()-.5)*.15,y2:best.p[1]+(Math.random()-.5)*.15,life:t.k=='mg'?.06:.18,max:t.k=='mg'?.06:.18});
   if(best.hp<=0){G.coins+=10;G.kills=(G.kills||0)+1;G.fx.push({x:best.p[0],y:best.p[1],c:'#7dff4a',life:.5,max:.5,t:'+10'})}}}}
 G.mobs=G.mobs.filter(m=>m.hp>0);
 for(const a of[G.shots,G.fx])for(const s of a)s.life-=dt;G.shots=G.shots.filter(s=>s.life>0);G.fx=G.fx.filter(s=>s.life>0);
 if(G.active&&G.spawnLeft==0&&G.mobs.length==0){G.active=false;const b=25+G.wave*5;G.coins+=b;G.msg='Wave '+G.wave+' cleared! +'+b}}
function loop(now){const dt=Math.min(.05,(now-(last||now))/1000);last=now;update(dt);draw(now);requestAnimationFrame(loop)}
function inR(p,r){return r&&p[0]>=r[0]&&p[0]<=r[0]+r[2]&&p[1]>=r[1]&&p[1]<=r[1]+r[3]}
function place(k,gx,gy){const c=key(gx,gy);if(G.coins<T[k].cost){G.msg='Not enough coins';return false}
 if(G.towers.some(t=>t.x==gx&&t.y==gy)||barAt(c))return false;
 if(k=='bar'){if(!PATH.has(c)){G.msg='Barricades go on the path';return false}if(PROTECT.has(c)){G.msg="Can't block entrance/exit";return false}
  if(G.mobs.some(m=>Math.abs(m.p[0]-gx-.5)<.75&&Math.abs(m.p[1]-gy-.5)<.75)){G.msg='Mob in the way';return false}
  G.coins-=T.bar.cost;G.bars.push({k:'bar',x:gx,y:gy,hp:BAR_HP});recompute();return true}
 if(PATH.has(c)){G.msg='Towers go on grass';return false}
 G.coins-=T[k].cost;G.towers.push({k,x:gx,y:gy,cd:0,ang:0,fl:-1e9});return true}
function tap(x,y){const p=[x,y],B=bounds();G.msg=G.over?G.msg:'';
 if(inR(p,G.sellBtn)){G.coins+=Math.floor(T[sel.k].cost/2);if(sel.k=='bar'){G.bars=G.bars.filter(b=>b!=sel);sel=null;recompute()}else{G.towers=G.towers.filter(t=>t!=sel);sel=null}return}
 for(const k of KINDS)if(inR(p,B[k])){picked=picked==k?null:k;sel=null;return}
 if(inR(p,B.go)){startRound();return}
 const gx=Math.floor((x-ox)/cell),gy=Math.floor((y-oy)/cell);if(gx<0||gy<0||gx>=COLS||gy>=ROWS){sel=null;return}
 const t=G.towers.find(t=>t.x==gx&&t.y==gy)||barAt(key(gx,gy));if(t){sel=sel==t?null:t;picked=null;return}
 sel=null;if(picked)place(picked,gx,gy)}
C.addEventListener('touchstart',e=>{e.preventDefault();const r=C.getBoundingClientRect(),t=e.changedTouches[0];tap(t.clientX-r.left,t.clientY-r.top)},{passive:false});
C.addEventListener('mousedown',e=>{const r=C.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top)});
['gesturestart','gesturechange','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
reset();layout();requestAnimationFrame(loop);
</script></body></html>
